# options_morning_bot.yml — Phase 4 Task 4.1 (PAPER mode)
# Runs scripts/options_morning_bot.py on the Alpaca PAPER account.
#
# PAPER ONLY — script hard-locks PAPER_TRADING=True and refuses live.
# NEVER touches rubber_band_bot.py logic.
#
# PRIMARY TRIGGER: run_bot.yml (cron-job.org every ~5 min) runs the options
# script during 9:28-16:05 ET weekdays. GitHub schedule was removed — it was
# delayed hours and missed the morning entry window entirely.
#
# This workflow remains for manual runs / debugging only.
#
# Uses secrets ALPACA_PAPER_KEY / ALPACA_PAPER_SECRET (NOT the live keys).

name: Options Morning Bot (PAPER)

on:
  workflow_dispatch: {}

concurrency:
  group: options-morning-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install alpaca-py pandas numpy lxml requests

      - name: Run options morning bot (PAPER)
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
        run: python scripts/options_morning_bot.py

      - name: Commit options run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/options/
          if git diff --staged --quiet; then
            echo "No new options log to commit."
            exit 0
          fi
          git commit -m "options paper bot log $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main && sleep 5
          done
          echo "ERROR: failed to push after 3 attempts"; exit 1
