# options_morning_bot.yml — Phase 4 Task 4.1 (PAPER mode)
# Runs scripts/options_morning_bot.py on the Alpaca PAPER account.
#
# PAPER ONLY — script hard-locks PAPER_TRADING=True and refuses live.
# NEVER touches rubber_band_bot.py or run_bot.yml.
#
# Schedule (EDT, UTC-4 summer):
#   */5 13-20  = every 5 min ~9:00am-4:55pm ET (full market day for now;
#                script self-guards 9:28-11:35am entry window; manage/exits all day)
#   30,50 19   = explicit EOD close sweep at 3:30pm and 3:50pm ET
#
# Data collection workflows (first_hour_collector, options_collector) stay DISABLED
# until Gate 1A passes Monday.

name: Options Morning Bot (PAPER)

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"   # every 5 min, full market day EDT (~9am-4:55pm ET)
    - cron: "30,50 19 * * 1-5"    # EOD close sweep 3:30 & 3:50pm ET
  workflow_dispatch: {}

concurrency:
  group: options-morning-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install alpaca-py pandas numpy lxml requests

      - name: Run options morning bot (PAPER)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/options_morning_bot.py

      - name: Commit options run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/options/
          if git diff --staged --quiet; then
            echo "No new options log to commit."
            exit 0
          fi
          git commit -m "options paper bot log $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main && sleep 5
          done
          echo "ERROR: failed to push after 3 attempts"; exit 1
