# DRAFT - disabled until reviewed; must not interfere with run_bot.yml.
#
# options_morning_bot.yml — Phase 4 Task 4.1 (PAPER mode)
# Runs scripts/options_morning_bot.py on the Alpaca PAPER account.
#
# Trades the PRELIMINARY Verdict-B heuristic (strong gap-down -> ATM call, EOD
# close, Tier 0). PAPER ONLY — the script hard-locks PAPER_TRADING=True and
# refuses to run live. It NEVER touches rubber_band_bot.py or run_bot.yml.
#
# Schedule intent (enable later by uncommenting + removing `if: false`):
#   - Entry/manage every 5 min, 9:28-11:35 ET  (GitHub cron min granularity = 5m;
#     the script guards its own 9:28-11:35 entry window and manage/exows after).
#   - EOD close sweep run(s) ~15:30 and ~15:50 ET.
#   UTC (EDT, summer, UTC-4): 9:30 ET = 13:30 UTC; 15:50 ET = 19:50 UTC.
#
# Dependencies vs run_bot.yml: none new beyond what collectors use (alpaca-py,
# pandas, lxml, requests, numpy). DO NOT modify run_bot.yml.

name: Options Morning Bot (PAPER) (DRAFT - DISABLED)

on:
  # Schedule COMMENTED OUT so this cannot trigger until manually reviewed.
  # To enable: uncomment the schedule block AND remove `if: false` below.
  #
  # schedule:
  #   - cron: "*/5 13-15 * * 1-5"   # ~9:28-11:55 ET entry/manage (EDT)
  #   - cron: "30,50 19 * * 1-5"    # ~15:30 & 15:50 ET EOD close sweep (EDT)
  workflow_dispatch: {}

concurrency:
  group: options-morning-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  morning-bot:
    # DRAFT GATE: remove `if: false` to enable this workflow.
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install alpaca-py pandas numpy lxml requests

      - name: Run options morning bot (PAPER)
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scripts/options_morning_bot.py

      - name: Commit options run log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/options/
          if git diff --staged --quiet; then
            echo "No new options log to commit."
            exit 0
          fi
          git commit -m "options paper bot log $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main && git rebase origin/main && sleep 5
          done
          echo "ERROR: failed to push after 3 attempts"; exit 1
