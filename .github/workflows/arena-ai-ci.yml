name: Arena AI safety tests

on:
  pull_request:
    paths:
      - 'research/trading-arena/**'
      - 'scripts/overnight/**'
      - '.github/workflows/arena-local-import.yml'
      - '.github/workflows/arena-paper.yml'
      - '.github/workflows/arena-ai-ci.yml'

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            research/trading-arena/
            scripts/overnight/
            .github/workflows/arena-paper.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test API-free paper worker and council safety
        run: python -m unittest discover -s research/trading-arena/tests -v
