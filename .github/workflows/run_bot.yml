name: Rubber Band Bot

# Trigger: cron-job.org webhook (~5 min, Chicago) via workflow_dispatch only.
# Native GitHub schedule is intentionally disabled — it drifts far more than cron-job.org.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode (auto = ET time detection)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning_prep
          - morning_scan
          - exits
          - evening_prep
          - scan
          - ext_exits
          - summary
          - weekly

concurrency:
  # Drop stale queued runs so a timeout backlog cannot skip market hours.
  group: rubber-band-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade alpaca-py yfinance pandas numpy lxml requests pyarrow

      - name: Initialize run output log files
        run: |
          ts=$(date -u '+%Y%m%dT%H%M%SZ')
          day=$(date -u '+%Y-%m-%d')
          mkdir -p logs/action_runs
          mkdir -p logs/action_runs/reports
          echo "RUN_STAMP=$ts" >> "$GITHUB_ENV"
          echo "RUN_DAY=$day" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "LIVE_LOG=logs/action_runs/${ts}_live_bot.log" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_LOG=logs/action_runs/${ts}_live_options.log" >> "$GITHUB_ENV"
          echo "OPTIONS_LOG=logs/action_runs/${ts}_options_bot.log" >> "$GITHUB_ENV"
          echo "DAY_REVIEW_DOC=logs/action_runs/reports/${day}_comprehensive_review.md" >> "$GITHUB_ENV"
          echo "DAY_RUN_INDEX=logs/action_runs/reports/${day}_run_index.csv" >> "$GITHUB_ENV"
          echo "LIVE_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_EXIT=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_DURATION_S=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "Run stamp: $ts"

      - name: Run live bot
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          LIVE_OPTIONS_SHARE: "0.50"
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          python rubber_band_bot.py 2>&1 | tee "$LIVE_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "LIVE_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Live bot exit code: $rc"
          echo "Live bot duration: ${dur}s"
          exit 0

      # Live options micro-sleeve: 50% of the rubber-band brokerage account.
      # Allow-list KEEP names only. Paper 1024-bucket lab stays PAPER below.
      - name: Run live options micro-sleeve (LIVE, 50% equity)
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LIVE_OPTIONS_SHARE: "0.50"
          LIVE_OPTIONS_MAX_POS: "1"
          LIVE_OPTIONS_PREMIUM_FRAC: "0.25"
          LIVE_OPTIONS_MAX_PREMIUM: "60"
          LIVE_OPTIONS_ALLOW: "S210,S406,S218,S350,S404,S397"
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          {
            export TZ=America/New_York
            dow=$(date +%u)
            if [ "$dow" -gt 5 ]; then
              echo "Weekend — skip live options micro"
              exit 0
            fi
            python scripts/options_live_micro.py
          } 2>&1 | tee "$LIVE_OPTIONS_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "LIVE_OPTIONS_EXIT=$rc" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Live options micro exit code: $rc"
          echo "Live options micro duration: ${dur}s"
          exit 0

      # Options paper bot: same cron as live bot (every ~5 min). Entry window 9:28-11:35 ET;
      # manage/exits until 16:05 ET weekdays.
      - name: Run options paper bot (PAPER, 9:28-16:05 ET weekdays)
        continue-on-error: true
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          OPTIONS_PAPER_UNLIMITED: "1"
          OPTIONS_CONTROLLED_LAYOUT: "1"
          OPTIONS_BUCKET_COUNT: "1024"
          # Keep ALL strategies live for ~1 week observation (incl. CLEAN KILL names).
          # Data-quality report still tags KILL/KEEP; revisit drop list after that window.
          OPTIONS_DROPPED_STRATEGIES: ""
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          {
            export TZ=America/New_York
            dow=$(date +%u)
            if [ "$dow" -gt 5 ]; then
              echo "Weekend — skip options paper bot"
              exit 0
            fi
            # Always run on weekdays so we always get an options status snapshot.
            # options_morning_bot.py itself enforces entry/manage windows and emits
            # after-hours summaries with open position visibility.
            python scripts/options_reconcile.py || echo "reconcile failed (non-fatal)"
            python scripts/init_options_trial.py
            python scripts/options_morning_bot.py
            opt_rc=$?
            if [ "$opt_rc" -ne 0 ]; then
              echo "WARNING: options_morning_bot exited $opt_rc (workflow still continues)"
            fi
            python scripts/options_strategy_lab.py --evaluate || echo "strategy eval failed (non-fatal)"
            python scripts/options_daily_bucket_report.py
            python scripts/options_strategy_selection_report.py
            python scripts/options_signal_frequency.py || echo "signal_frequency report failed (non-fatal)"
            python scripts/options_ledger_health.py || echo "ledger_health failed (non-fatal)"
            python scripts/options_data_quality_report.py || echo "data_quality report failed (non-fatal)"
            python scripts/generate_dashboard.py || echo "dashboard failed (non-fatal)"
            python scripts/rubber_band_report.py || echo "rubber_band_report failed (non-fatal)"
          } 2>&1 | tee "$OPTIONS_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "OPTIONS_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Options bot exit code: $rc"
          echo "Options bot duration: ${dur}s"
          # Job Summary: CLEAN / TAINTED / KEEP-only (visible on Actions run page)
          {
            echo "## Options data quality"
            echo
            if [ -f logs/options_trial/reports/latest_data_quality_snippet.md ]; then
              cat logs/options_trial/reports/latest_data_quality_snippet.md
            else
              echo "_Data quality snippet not available this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Append run to daily comprehensive review
        if: always()
        run: |
          if [ ! -f "$DAY_REVIEW_DOC" ]; then
            {
              echo "# Daily Comprehensive Action Review — ${RUN_DAY}"
              echo
              echo "_Auto-generated from GitHub Actions run output. This document appends every run for the day._"
              echo
            } > "$DAY_REVIEW_DOC"
          fi
          if [ ! -f "$DAY_RUN_INDEX" ]; then
            echo "run_stamp,run_number,run_id,live_exit,options_exit,live_duration_s,options_duration_s,event_type" > "$DAY_RUN_INDEX"
          fi

          {
            echo "## Run ${RUN_STAMP}"
            echo
            echo "- UTC timestamp: \`${RUN_STAMP}\`"
            echo "- GitHub run: [#${RUN_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID})"
            echo "- Run id: \`${RUN_ID}\`"
            echo "- Live bot: exit=\`${LIVE_BOT_EXIT:-0}\`, duration=\`${LIVE_BOT_DURATION_S:-0}s\`"
            echo "- Live options: exit=\`${LIVE_OPTIONS_EXIT:-0}\`, duration=\`${LIVE_OPTIONS_DURATION_S:-0}s\`"
            echo "- Options bot: exit=\`${OPTIONS_BOT_EXIT:-0}\`, duration=\`${OPTIONS_BOT_DURATION_S:-0}s\`"
            if [ -f "logs/options_trial/reports/latest_data_quality_snippet.md" ]; then
              echo
              cat logs/options_trial/reports/latest_data_quality_snippet.md
            fi
            if [ -f "logs/options_trial/runs.jsonl" ]; then
              echo "- Options structured summary (latest JSON):"
              echo '```json'
              tail -n 1 logs/options_trial/runs.jsonl
              echo '```'
            fi
            echo
            echo "### Live bot full output"
            echo
            echo '```text'
            cat "$LIVE_LOG"
            echo '```'
            echo
            if [ -f "$LIVE_OPTIONS_LOG" ]; then
              echo "### Live options micro full output"
              echo
              echo '```text'
              cat "$LIVE_OPTIONS_LOG"
              echo '```'
              echo
            fi
            echo "### Options bot full output"
            echo
            echo '```text'
            cat "$OPTIONS_LOG"
            echo '```'
            echo
            echo "---"
            echo
          } >> "$DAY_REVIEW_DOC"
          echo "${RUN_STAMP},${RUN_NUMBER},${RUN_ID},${LIVE_BOT_EXIT:-0},${OPTIONS_BOT_EXIT:-0},${LIVE_BOT_DURATION_S:-0},${OPTIONS_BOT_DURATION_S:-0},${GITHUB_EVENT_NAME:-unknown}" >> "$DAY_RUN_INDEX"

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Stash this run's logs, reset logs/ to remote, merge append-only files
          mkdir -p /tmp/botlogs_run
          cp -r logs/. /tmp/botlogs_run/ 2>/dev/null || true
          # Clean local logs workspace before switching to remote main snapshot.
          git reset --hard
          git clean -fd logs
          git checkout -B main origin/main
          mkdir -p logs
          python scripts/merge_bot_logs.py /tmp/botlogs_run logs
          if [ -d /tmp/botlogs_run/options_trial ]; then
            mkdir -p logs/options_trial
            cp -r /tmp/botlogs_run/options_trial/. logs/options_trial/
          fi
          if [ -d /tmp/botlogs_run/options_live_micro ]; then
            mkdir -p logs/options_live_micro
            cp -r /tmp/botlogs_run/options_live_micro/. logs/options_live_micro/
          fi
          python scripts/reconcile_daily_logs.py logs 14
          python scripts/daily_slippage_watch.py logs
          git add logs/
          if git diff --staged --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            # Rebase this log commit onto the latest remote main right before push.
            # This avoids repeated non-fast-forward failures when another workflow
            # lands a commit between our fetch/reset and push.
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; merging remote and retrying..."
            git fetch origin main
            git reset --hard
            git clean -fd logs
            git checkout -B main origin/main
            mkdir -p logs
            python scripts/merge_bot_logs.py /tmp/botlogs_run logs
            if [ -d /tmp/botlogs_run/options_trial ]; then
              mkdir -p logs/options_trial
              cp -r /tmp/botlogs_run/options_trial/. logs/options_trial/
            fi
            if [ -d /tmp/botlogs_run/options_live_micro ]; then
              mkdir -p logs/options_live_micro
              cp -r /tmp/botlogs_run/options_live_micro/. logs/options_live_micro/
            fi
            python scripts/reconcile_daily_logs.py logs 14
            python scripts/daily_slippage_watch.py logs
            git add logs/
            if git diff --staged --quiet; then
              echo "No log changes after refresh"
              exit 0
            fi
            git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 3
          done
          echo "ERROR: failed to push logs after 5 attempts"
          exit 1

      - name: Fail workflow if bot step failed
        if: always()
        run: |
          echo "Live bot exit code: ${LIVE_BOT_EXIT:-0}"
          echo "Live options micro exit code: ${LIVE_OPTIONS_EXIT:-0}"
          echo "Options bot exit code: ${OPTIONS_BOT_EXIT:-0}"
          live=${LIVE_BOT_EXIT:-0}
          opt=${OPTIONS_BOT_EXIT:-0}
          # Bot steps already use continue-on-error so logs can still commit.
          # Prefer warnings over a red job when only one bot hiccups — otherwise
          # operators see "This job failed" even after a successful log push,
          # and cancel/queue chaos can skip the trading day.
          if [ "$live" -ne 0 ] && [ "$opt" -ne 0 ]; then
            echo "::error::Both live and options bots failed (live=$live options=$opt). See logs/action_runs/."
            exit 1
          fi
          if [ "$live" -ne 0 ]; then
            echo "::warning::Live bot failed (exit=$live). See $LIVE_LOG"
          fi
          if [ "$opt" -ne 0 ]; then
            echo "::warning::Options bot failed (exit=$opt). See $OPTIONS_LOG"
          fi
          echo "Workflow continuing (log commit already attempted)."
