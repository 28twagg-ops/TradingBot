name: Rubber Band Bot v5

# HOW THIS TRIGGERS:
#   cron-job.org hits the repository_dispatch endpoint twice daily.
#   The bot auto-detects what to do based on the time it runs.
#   workflow_dispatch = the manual "Run workflow" button in GitHub Actions UI.
#
# NO schedule: block here. Your cron-job.org IS the scheduler.
# Adding schedule: here too would run the bot TWICE and cause duplicate trades.
#
# SET UP TWO CRON-JOB.ORG JOBS pointing to:
#   POST https://api.github.com/repos/YOUR_USERNAME/TradingBot/dispatches
#   Body: {"event_type":"run-bot"}
#   Times:
#     13:35 UTC  (9:35am ET)   — morning exit check
#     20:15 UTC  (4:15pm ET)   — full daily scan
#   Auth header: Authorization: token YOUR_GITHUB_PAT

on:
  workflow_dispatch:       # Manual "Run workflow" button in GitHub UI
  repository_dispatch:     # Triggered by cron-job.org POST request
    types: [run-bot]

jobs:
  run_bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Needed to commit logs back to the repo

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install alpaca-py yfinance pandas numpy lxml requests

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python rubber_band_bot.py

      - name: Commit logs back to repo
        # This is how your logs persist — they get saved INTO the GitHub repo
        # itself after every run. You can read them at any time by browsing
        # your repo files on github.com.
        run: |
          git config --local user.email "tradingbot@noreply"
          git config --local user.name "Rubber Band Bot"
          git add logs/ || true
          git diff --staged --quiet || git commit -m "Bot run $(date -u '+%Y-%m-%d %H:%M') UTC"
          git push || true
