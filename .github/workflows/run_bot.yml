name: Trading Bot Run
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 8-15 * * 1-5'
      timezone: 'America/Chicago' # This ensures it hits Oklahoma market hours exactly
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # Updated version
      - name: Set up Python
        uses: actions/setup-python@v5 # Updated version
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install alpaca-py yfinance pandas numpy lxml
      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python rubber_band_bot.py
