name: Rubber Band Bot

# cron-job.org webhook (Chicago): see logs/failed_run_diagnosis.md for schedule.
# Modes auto-detected via BOT_MODE=auto or explicit workflow_dispatch input.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode (auto = ET time detection)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning_prep
          - morning_scan
          - exits
          - evening_prep
          - scan
          - ext_exits
          - summary
          - weekly

concurrency:
  group: rubber-band-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install alpaca-py yfinance pandas numpy lxml requests

      - name: Run live bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: python rubber_band_bot.py

      - name: Commit logs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          # Stash this run's logs, reset logs/ to remote, merge append-only files
          mkdir -p /tmp/botlogs_run
          cp -r logs/. /tmp/botlogs_run/ 2>/dev/null || true
          git checkout origin/main -- logs/ 2>/dev/null || mkdir -p logs
          python scripts/merge_bot_logs.py /tmp/botlogs_run logs
          git add logs/
          if git diff --staged --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; merging remote and retrying..."
            git fetch origin main
            git checkout origin/main -- logs/
            python scripts/merge_bot_logs.py /tmp/botlogs_run logs
            git add logs/
            git commit --amend --no-edit || git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 3
          done
          echo "ERROR: failed to push logs after 5 attempts"
          exit 1
