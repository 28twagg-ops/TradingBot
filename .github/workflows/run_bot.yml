name: Rubber Band Bot

# Triggered by cron-job.org webhook (Chicago time: 0,15,30,45 8-18 * * 1-5)
# The bot uses US Eastern Time internally (zoneinfo) to decide what mode to run.
# Modes: exits (market hours) | scan (3:44-3:59pm ET) | ext_exits (4pm-8pm ET)
#        weekly (weekend) | summary (outside all windows)

on:
  workflow_dispatch:  # cron-job.org hits this URL, also allows manual "Run workflow"

permissions:
  contents: write   # needed to commit logs back to repo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install alpaca-py yfinance pandas numpy lxml requests

      - name: Run live bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python rubber_band_bot.py

      - name: Commit logs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
