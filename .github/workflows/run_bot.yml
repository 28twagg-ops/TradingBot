name: Rubber Band Bot

# Trigger: cron-job.org webhook (~5 min, Chicago) via workflow_dispatch only.
# Native GitHub schedule is intentionally disabled — it drifts far more than cron-job.org.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode (auto = ET time detection)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning_prep
          - morning_scan
          - exits
          - evening_prep
          - scan
          - ext_exits
          - summary
          - weekly

concurrency:
  # Drop stale queued runs so a timeout backlog cannot skip market hours.
  group: rubber-band-bot
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Paper options: LIVE MIRROR control on new ~$1M paper account.
      # Same 4 strategies + baseline TP/SL as live micro. Set to "0" to disable.
      OPTIONS_PAPER_ENABLED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --upgrade alpaca-py yfinance pandas numpy lxml requests pyarrow

      - name: Initialize run output log files
        run: |
          ts=$(date -u '+%Y%m%dT%H%M%SZ')
          day=$(date -u '+%Y-%m-%d')
          mkdir -p logs/action_runs
          mkdir -p logs/action_runs/reports
          LIVE_LOG="logs/action_runs/${ts}_live_bot.log"
          LIVE_OPTIONS_LOG="logs/action_runs/${ts}_live_options.log"
          OPTIONS_LOG="logs/action_runs/${ts}_options_bot.log"
          touch "$LIVE_LOG" "$LIVE_OPTIONS_LOG"
          if [ "${OPTIONS_PAPER_ENABLED:-0}" = "1" ]; then
            touch "$OPTIONS_LOG"
          else
            echo "Paper options bot disabled (OPTIONS_PAPER_ENABLED=${OPTIONS_PAPER_ENABLED:-0})" > "$OPTIONS_LOG"
          fi
          echo "RUN_STAMP=$ts" >> "$GITHUB_ENV"
          echo "RUN_DAY=$day" >> "$GITHUB_ENV"
          echo "RUN_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RUN_ID=${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "LIVE_LOG=$LIVE_LOG" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_LOG=$LIVE_OPTIONS_LOG" >> "$GITHUB_ENV"
          echo "OPTIONS_LOG=$OPTIONS_LOG" >> "$GITHUB_ENV"
          echo "DAY_REVIEW_DOC=logs/action_runs/reports/${day}_comprehensive_review.md" >> "$GITHUB_ENV"
          echo "DAY_RUN_INDEX=logs/action_runs/reports/${day}_run_index.csv" >> "$GITHUB_ENV"
          echo "LIVE_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_EXIT=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_DURATION_S=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "Run stamp: $ts"

      - name: Run live bot
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
          LIVE_OPTIONS_SHARE: "0.25"
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          python rubber_band_bot.py 2>&1 | tee "$LIVE_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "LIVE_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Live bot exit code: $rc"
          echo "Live bot duration: ${dur}s"
          exit 0

      # Live options micro-sleeve: 25% while orphans/stops are cleaned up.
      # LIVE_OPTIONS_ENTRIES=0 = manage/orphan only (no new buys).
      # LIVE_OPTIONS_ALLOW is membership only; options_live_micro.py always
      # tries higher CLEAN win-rate names first (S404 > S406 > S218).
      - name: Run live options micro-sleeve (LIVE, 25% equity, entries paused)
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          LIVE_OPTIONS_SHARE: "0.25"
          LIVE_OPTIONS_ENTRIES: "0"
          LIVE_OPTIONS_ALLOW: "S404,S406,S218"
          LIVE_OPTIONS_MIN_COST: "20"
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          {
            export TZ=America/New_York
            dow=$(date +%u)
            if [ "$dow" -gt 5 ]; then
              echo "Weekend — skip live options micro"
              exit 0
            fi
            python scripts/options_live_micro.py
          } 2>&1 | tee "$LIVE_OPTIONS_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "LIVE_OPTIONS_EXIT=$rc" >> "$GITHUB_ENV"
          echo "LIVE_OPTIONS_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Live options micro exit code: $rc"
          echo "Live options micro duration: ${dur}s"
          exit 0

      # Paper options: live-control study — same 4 strategies + baseline TP/SL as live.
      - name: Run options paper bot (PAPER, 9:28-16:05 ET weekdays)
        if: env.OPTIONS_PAPER_ENABLED == '1'
        continue-on-error: true
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          OPTIONS_PAPER_UNLIMITED: "1"
          # Mirror live micro (not the 1024-bucket lab) as a paper control.
          OPTIONS_MIRROR_LIVE: "1"
          OPTIONS_ALLOWED_STRATEGIES: "S404,S406,S218,S210"
          OPTIONS_CONTROLLED_LAYOUT: "0"
          OPTIONS_TOP_BUCKET_PCT: "0"
          OPTIONS_DROPPED_STRATEGIES: ""
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          {
            export TZ=America/New_York
            dow=$(date +%u)
            if [ "$dow" -gt 5 ]; then
              echo "Weekend — skip options paper bot"
              exit 0
            fi
            # Always run on weekdays so we always get an options status snapshot.
            # options_morning_bot.py itself enforces entry/manage windows and emits
            # after-hours summaries with open position visibility.
            python scripts/options_reconcile.py || echo "reconcile failed (non-fatal)"
            python scripts/init_options_trial.py
            python scripts/options_morning_bot.py
            opt_rc=$?
            if [ "$opt_rc" -ne 0 ]; then
              echo "WARNING: options_morning_bot exited $opt_rc (workflow still continues)"
            fi
            python scripts/options_strategy_lab.py --evaluate || echo "strategy eval failed (non-fatal)"
            python scripts/options_daily_bucket_report.py
            python scripts/options_strategy_selection_report.py
            python scripts/options_signal_frequency.py || echo "signal_frequency report failed (non-fatal)"
            python scripts/options_ledger_health.py || echo "ledger_health failed (non-fatal)"
            python scripts/options_data_quality_report.py || echo "data_quality report failed (non-fatal)"
            python scripts/generate_dashboard.py || echo "dashboard failed (non-fatal)"
            python scripts/rubber_band_report.py || echo "rubber_band_report failed (non-fatal)"
          } 2>&1 | tee "$OPTIONS_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "OPTIONS_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Options bot exit code: $rc"
          echo "Options bot duration: ${dur}s"
          # Job Summary: CLEAN / TAINTED / KEEP-only (visible on Actions run page)
          {
            echo "## Options data quality"
            echo
            if [ -f logs/options_trial/reports/latest_data_quality_snippet.md ]; then
              cat logs/options_trial/reports/latest_data_quality_snippet.md
            else
              echo "_Data quality snippet not available this run._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Append run to daily comprehensive review
        if: always()
        continue-on-error: true
        env:
          OPTIONS_PAPER_ENABLED: ${{ env.OPTIONS_PAPER_ENABLED }}
        run: |
          python scripts/append_action_run_review.py || {
            echo "::warning::Append review failed; per-run log files are still under logs/action_runs/"
            exit 0
          }

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          merge_run_logs() {
            python scripts/merge_bot_logs.py /tmp/botlogs_run logs
            if [ -d /tmp/botlogs_run/options_trial ]; then
              mkdir -p logs/options_trial
              cp -r /tmp/botlogs_run/options_trial/. logs/options_trial/
            fi
            if [ -d /tmp/botlogs_run/options_live_micro ]; then
              mkdir -p logs/options_live_micro
              cp -r /tmp/botlogs_run/options_live_micro/. logs/options_live_micro/
            fi
          }

          postprocess_logs() {
            python scripts/reconcile_daily_logs.py logs 14
            python scripts/daily_slippage_watch.py logs
          }

          git fetch origin main
          mkdir -p /tmp/botlogs_run
          cp -r logs/. /tmp/botlogs_run/ 2>/dev/null || true
          git reset --hard
          git clean -fd logs
          git checkout -B main origin/main
          mkdir -p logs
          merge_run_logs
          postprocess_logs
          git add logs/
          if git diff --staged --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; merging remote and retrying..."
            git fetch origin main
            git reset --hard
            git clean -fd logs
            git checkout -B main origin/main
            mkdir -p logs
            merge_run_logs
            git add logs/
            if git diff --staged --quiet; then
              echo "No log changes after refresh"
              exit 0
            fi
            git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 3
          done
          echo "ERROR: failed to push logs after 5 attempts"
          exit 1

      - name: Fail workflow if bot step failed
        if: always()
        run: |
          echo "Live bot exit code: ${LIVE_BOT_EXIT:-0}"
          echo "Live options micro exit code: ${LIVE_OPTIONS_EXIT:-0}"
          echo "Paper options bot exit code: ${OPTIONS_BOT_EXIT:-0}"
          live=${LIVE_BOT_EXIT:-0}
          live_opt=${LIVE_OPTIONS_EXIT:-0}
          # Bot steps already use continue-on-error so logs can still commit.
          if [ "$live" -ne 0 ] && [ "$live_opt" -ne 0 ]; then
            echo "::error::Both live rubber-band and live options failed (live=$live live_options=$live_opt). See logs/action_runs/."
            exit 1
          fi
          if [ "$live" -ne 0 ]; then
            echo "::warning::Live bot failed (exit=$live). See $LIVE_LOG"
          fi
          if [ "$live_opt" -ne 0 ]; then
            echo "::warning::Live options micro failed (exit=$live_opt). See $LIVE_OPTIONS_LOG"
          fi
          echo "Workflow continuing (log commit already attempted)."
