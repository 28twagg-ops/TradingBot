name: Rubber Band Bot

# cron-job.org webhook every ~5 min (Chicago): runs LIVE rubber_band_bot + PAPER options_morning_bot.
# Modes auto-detected via BOT_MODE=auto or explicit workflow_dispatch input.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Bot mode (auto = ET time detection)"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - morning_prep
          - morning_scan
          - exits
          - evening_prep
          - scan
          - ext_exits
          - summary
          - weekly

concurrency:
  group: rubber-band-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install alpaca-py yfinance pandas numpy lxml requests pyarrow

      - name: Initialize run output log files
        run: |
          ts=$(date -u '+%Y%m%dT%H%M%SZ')
          day=$(date -u '+%Y-%m-%d')
          mkdir -p logs/action_runs
          mkdir -p logs/action_runs/reports
          echo "RUN_STAMP=$ts" >> "$GITHUB_ENV"
          echo "RUN_DAY=$day" >> "$GITHUB_ENV"
          echo "LIVE_LOG=logs/action_runs/${ts}_live_bot.log" >> "$GITHUB_ENV"
          echo "OPTIONS_LOG=logs/action_runs/${ts}_options_bot.log" >> "$GITHUB_ENV"
          echo "DAY_REVIEW_DOC=logs/action_runs/reports/${day}_comprehensive_review.md" >> "$GITHUB_ENV"
          echo "LIVE_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_EXIT=0" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=0" >> "$GITHUB_ENV"
          echo "Run stamp: $ts"

      - name: Run live bot
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          BOT_MODE: ${{ github.event.inputs.mode || 'auto' }}
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          python rubber_band_bot.py 2>&1 | tee "$LIVE_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "LIVE_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "LIVE_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Live bot exit code: $rc"
          echo "Live bot duration: ${dur}s"
          exit 0

      # Options paper bot: same cron as live bot (every ~5 min). Entry window 9:28-11:35 ET;
      # manage/exits until 16:05 ET weekdays.
      - name: Run options paper bot (PAPER, 9:28-16:05 ET weekdays)
        continue-on-error: true
        env:
          ALPACA_PAPER_KEY: ${{ secrets.ALPACA_PAPER_KEY }}
          ALPACA_PAPER_SECRET: ${{ secrets.ALPACA_PAPER_SECRET }}
          OPTIONS_PAPER_UNLIMITED: "1"
        run: |
          set +e
          set -o pipefail
          t0=$(date +%s)
          {
            export TZ=America/New_York
            dow=$(date +%u)
            if [ "$dow" -gt 5 ]; then
              echo "Weekend — skip options paper bot"
              exit 0
            fi
            # Always run on weekdays so we always get an options status snapshot.
            # options_morning_bot.py itself enforces entry/manage windows and emits
            # after-hours summaries with open position visibility.
            python scripts/init_options_trial.py
            python scripts/options_morning_bot.py
            python scripts/options_daily_bucket_report.py
            python scripts/options_strategy_selection_report.py
          } 2>&1 | tee "$OPTIONS_LOG"
          rc=${PIPESTATUS[0]}
          t1=$(date +%s)
          dur=$((t1 - t0))
          echo "OPTIONS_BOT_EXIT=$rc" >> "$GITHUB_ENV"
          echo "OPTIONS_BOT_DURATION_S=$dur" >> "$GITHUB_ENV"
          echo "Options bot exit code: $rc"
          echo "Options bot duration: ${dur}s"
          exit 0

      - name: Append run to daily comprehensive review
        if: always()
        run: |
          if [ ! -f "$DAY_REVIEW_DOC" ]; then
            {
              echo "# Daily Comprehensive Action Review — ${RUN_DAY}"
              echo
              echo "_Auto-generated from GitHub Actions run output. This document appends every run for the day._"
              echo
            } > "$DAY_REVIEW_DOC"
          fi

          {
            echo "## Run ${RUN_STAMP}"
            echo
            echo "- UTC timestamp: \`${RUN_STAMP}\`"
            echo "- Live bot: exit=\`${LIVE_BOT_EXIT:-0}\`, duration=\`${LIVE_BOT_DURATION_S:-0}s\`"
            echo "- Options bot: exit=\`${OPTIONS_BOT_EXIT:-0}\`, duration=\`${OPTIONS_BOT_DURATION_S:-0}s\`"
            if [ -f "logs/options_trial/runs.jsonl" ]; then
              echo "- Options structured summary (latest JSON):"
              echo '```json'
              tail -n 1 logs/options_trial/runs.jsonl
              echo '```'
            fi
            echo
            echo "### Live bot full output"
            echo
            echo '```text'
            cat "$LIVE_LOG"
            echo '```'
            echo
            echo "### Options bot full output"
            echo
            echo '```text'
            cat "$OPTIONS_LOG"
            echo '```'
            echo
            echo "---"
            echo
          } >> "$DAY_REVIEW_DOC"

      - name: Commit logs back to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          # Stash this run's logs, reset logs/ to remote, merge append-only files
          mkdir -p /tmp/botlogs_run
          cp -r logs/. /tmp/botlogs_run/ 2>/dev/null || true
          mkdir -p logs
          python scripts/merge_bot_logs.py /tmp/botlogs_run logs
          if [ -d /tmp/botlogs_run/options_trial ]; then
            mkdir -p logs/options_trial
            cp -r /tmp/botlogs_run/options_trial/. logs/options_trial/
          fi
          python scripts/reconcile_daily_logs.py logs 14
          python scripts/daily_slippage_watch.py logs
          git add logs/
          if git diff --staged --quiet; then
            echo "No log changes to commit"
            exit 0
          fi
          git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            # Rebase this log commit onto the latest remote main right before push.
            # This avoids repeated non-fast-forward failures when another workflow
            # lands a commit between our fetch/reset and push.
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed; merging remote and retrying..."
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p logs
            python scripts/merge_bot_logs.py /tmp/botlogs_run logs
            if [ -d /tmp/botlogs_run/options_trial ]; then
              mkdir -p logs/options_trial
              cp -r /tmp/botlogs_run/options_trial/. logs/options_trial/
            fi
            python scripts/reconcile_daily_logs.py logs 14
            python scripts/daily_slippage_watch.py logs
            git add logs/
            if git diff --staged --quiet; then
              echo "No log changes after refresh"
              exit 0
            fi
            git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
            sleep 3
          done
          echo "ERROR: failed to push logs after 5 attempts"
          exit 1

      - name: Fail workflow if bot step failed
        if: always()
        run: |
          echo "Live bot exit code: ${LIVE_BOT_EXIT:-0}"
          echo "Options bot exit code: ${OPTIONS_BOT_EXIT:-0}"
          if [ "${LIVE_BOT_EXIT:-0}" -ne 0 ] || [ "${OPTIONS_BOT_EXIT:-0}" -ne 0 ]; then
            echo "One or more bot steps failed. See logs/action_runs/*.log for full output."
            exit 1
          fi
