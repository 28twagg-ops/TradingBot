name: Rubber Band Bot

on:
  schedule:
    # 9:35am ET exits check
    # EDT (Mar-Nov): 13:35 UTC  |  EST (Nov-Mar): 14:35 UTC
    - cron: '35 13 * * 1-5'
    - cron: '35 14 * * 1-5'
    # 3:50pm ET main scan + entries (before close so orders execute same day)
    # EDT (Mar-Nov): 19:50 UTC  |  EST (Nov-Mar): 20:50 UTC
    - cron: '50 19 * * 1-5'
    - cron: '50 20 * * 1-5'
    # Saturday weekly summary (any time, market closed)
    - cron: '0 14 * * 6'
  workflow_dispatch:  # manual trigger from GitHub UI

permissions:
  contents: write   # needed to commit logs back to repo

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python rubber_band_bot.py

      - name: Commit logs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --staged --quiet || git commit -m "bot run $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
