name: Arena strategy validation
on:
  pull_request:
    paths:
      - 'research/trading-arena/**'
      - '.github/workflows/arena-strategy-validation.yml'
  push:
    branches: [main]
    paths:
      - 'research/trading-arena/**'
      - '.github/workflows/arena-strategy-validation.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Arena modules
        run: python -m compileall -q research/trading-arena
      - name: Run offline regression tests
        run: python -m unittest discover -s research/trading-arena/tests -v
